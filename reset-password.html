<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>CAREE-UP - 새 비밀번호 설정</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0f19;color:#e2e8f0;font:15px/1.6 system-ui,-apple-system,sans-serif}.card{width:100%;max-width:440px;padding:32px;background:#111827;border:1px solid #2a364f;border-radius:24px;box-shadow:0 20px 70px #0004}.brand{color:#4fd1c5;letter-spacing:2px;font-size:14px;font-weight:800}h1{font-size:25px;line-height:1.35;margin:18px 0 10px}p{color:#94a3b8}label{display:block;margin:18px 0 8px;font-weight:600}input{width:100%;padding:14px;border-radius:12px;border:1px solid #2a364f;background:#0b0f19;color:#fff;font:inherit}input:focus{outline:2px solid #4fd1c5;outline-offset:2px}button,.primary{display:block;width:100%;margin-top:24px;padding:14px;border:0;border-radius:12px;background:#4fd1c5;color:#0b0f19;font:700 15px system-ui;cursor:pointer;text-align:center;text-decoration:none}button:disabled{opacity:.5;cursor:wait}a{color:#4fd1c5}.back{display:block;text-align:center;margin-top:20px;font-size:14px}.error{color:#fda4af;background:#fb718512;padding:12px;border-radius:10px}.success{color:#4fd1c5}.email{font-size:13px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="card">
<div class="brand">CAREE-UP</div>
<h1>새 비밀번호 설정</h1>
<p id="status" role="status">재설정 링크를 확인하고 있습니다…</p>
<p id="account" class="email" hidden></p>
<form id="password-form" hidden>
<label for="password">새 비밀번호</label>
<input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="20" placeholder="8~20자">
<label for="password-confirm">새 비밀번호 확인</label>
<input id="password-confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="20">
<p id="form-error" role="alert" class="error" hidden></p>
<button id="submit-button" type="submit">비밀번호 변경</button>
</form>
<a id="return-login" href="index.html" class="back">로그인 화면으로 돌아가기</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
const SUPABASE_URL = 'https://rrfydzmsjwfgxfynfqys.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_jSOvZcQtUoXJvgQ6CRCZ8w_5rBSamsS';
const resetClient = window.supabase?.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: false, flowType: 'implicit' }
});
let recoveryReady = false;
let saving = false;
const statusBox = document.getElementById('status');
const form = document.getElementById('password-form');
const errorBox = document.getElementById('form-error');
const button = document.getElementById('submit-button');
function failLink(message) {
    recoveryReady = false;
    form.hidden = true;
    statusBox.textContent = message;
    statusBox.className = 'error';
}
async function initializeRecovery() {
    // Read the default Supabase recovery link's tokens once, then remove them from the URL.
    const fragment = new URLSearchParams(window.location.hash.slice(1));
    window.history.replaceState(null, '', window.location.pathname + window.location.search);
    if (fragment.has('error') || fragment.has('error_description')) {
        failLink('재설정 링크가 만료되었거나 이미 사용되었습니다. 로그인 화면에서 새 메일을 요청해주세요.');
        return;
    }
    if (fragment.get('type') !== 'recovery' || !fragment.get('access_token') || !fragment.get('refresh_token')) {
        failLink('메일의 Reset Password 링크로 이 페이지를 열어주세요. 링크가 만료되었다면 로그인 화면에서 새 메일을 요청해주세요.');
        return;
    }
    try {
        if (!resetClient) throw new Error('인증 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하고 새 재설정 메일을 요청해주세요.');
        const { data, error } = await resetClient.auth.setSession({
            access_token: fragment.get('access_token'), refresh_token: fragment.get('refresh_token')
        });
        if (error || !data.session) throw new Error('재설정 링크가 만료되었거나 유효하지 않습니다. 로그인 화면에서 새 메일을 요청해주세요.');
        const result = await resetClient.auth.getUser();
        if (result.error || !result.data.user) throw new Error('계정 확인에 실패했습니다. 로그인 화면에서 새 메일을 요청해주세요.');
        recoveryReady = true;
        statusBox.textContent = '새 비밀번호를 입력해주세요.';
        const account = document.getElementById('account');
        account.textContent = result.data.user.email || '';
        account.hidden = false;
        form.hidden = false;
        document.getElementById('password').focus();
    } catch (error) {
        failLink(error.message || '재설정 링크를 확인할 수 없습니다. 새 메일을 요청해주세요.');
        if (resetClient) { try { await resetClient.auth.signOut({ scope: 'local' }); } catch (_) {} }
    }
}
form.addEventListener('submit', async event => {
    event.preventDefault();
    if (saving || !form.reportValidity()) return;
    errorBox.hidden = true;
    if (!recoveryReady) { failLink('로그인 화면에서 새 재설정 메일을 요청해주세요.'); return; }
    const password = document.getElementById('password').value;
    if (password !== document.getElementById('password-confirm').value) {
        errorBox.textContent = '비밀번호 확인이 일치하지 않습니다.'; errorBox.hidden = false; return;
    }
    saving = true; button.disabled = true; button.textContent = '변경 중…';
    try {
        const { error } = await resetClient.auth.updateUser({ password });
        if (error) throw error;
        recoveryReady = false;
        form.reset(); form.hidden = true;
        statusBox.textContent = '비밀번호가 변경되었습니다. 로그인 화면에서 새 비밀번호로 로그인해주세요.';
        statusBox.className = 'success';
        document.getElementById('return-login').className = 'primary';
        try { await resetClient.auth.signOut({ scope: 'local' }); } catch (_) {}
    } catch (error) {
        errorBox.textContent = error.code === 'same_password' ? '기존 비밀번호와 다른 비밀번호를 입력해주세요.' :
            (error.message || '비밀번호를 변경할 수 없습니다. 새 메일을 요청해주세요.');
        errorBox.hidden = false;
    } finally {
        saving = false; button.disabled = false; button.textContent = '비밀번호 변경';
    }
});
initializeRecovery();
</script>
</body>
</html>
